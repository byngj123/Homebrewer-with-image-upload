services:
  mongodb:
    image: mongo:latest
    volumes:
      - mongodata:/data/db
  homebrewery:
    build:
      context: .
      dockerfile: Dockerfile
    image: homebrewery
    environment:
      MONGODB_URI: mongodb://mongodb/homebrewery
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/usr/src/app/uploads
volumes:
  mongodata:
  uploads:
